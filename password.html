<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Lab — CYBERCORE</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/simulations.css" />
</head>
<body>
  <header class="navbar navbar--scrolled">
    <div class="navbar__inner">
      <a href="../index.html" class="brand">
        <span class="brand__logo">[C]</span>
        <span class="brand__text">CYBER<span>CORE</span></span>
      </a>
      <nav class="nav" id="navMenu">
        <a href="../dashboard.php" class="nav__link">Dashboard</a>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <section class="sim">
    <div class="sim__head">
      <p class="sim__code">[ MOD-02 · PASSWORD ]</p>
      <h1 class="sim__title">Password Strength Lab</h1>
      <p class="sim__lead">
        Type a password to get a live entropy analysis and crack-time estimate.
        Nothing is sent to any server — this runs entirely in your browser.
      </p>
    </div>

    <div class="panel">
      <div class="field">
        <label for="pw">Test Password</label>
        <input class="input" type="password" id="pw"
               placeholder="Type a password…" autocomplete="off" />
      </div>

      <div class="meter" aria-hidden="true">
        <div class="meter__bar" id="meterBar"></div>
      </div>
      <p class="meter__label" id="meterLabel">Awaiting input…</p>

      <div class="pw-grid">
        <div class="pw-grid__item">
          <span class="pw-grid__label">Entropy</span>
          <span class="pw-grid__value" id="entropyOut">0 bits</span>
        </div>
        <div class="pw-grid__item">
          <span class="pw-grid__label">Crack Time</span>
          <span class="pw-grid__value" id="crackOut">—</span>
        </div>
        <div class="pw-grid__item">
          <span class="pw-grid__label">Length</span>
          <span class="pw-grid__value" id="lenOut">0</span>
        </div>
      </div>

      <h3 style="margin-top:28px;">Rule Breakdown</h3>
      <ul class="rules" id="rulesList"></ul>
    </div>
  </section>

  <script src="../js/main.js"></script>
  <script src="../js/password.js"></script>
</body>
</html>
